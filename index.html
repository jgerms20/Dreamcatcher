<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c14" />
    <meta name="description" content="DreamCatcher — record, expand, interpret and visualize your dreams." />

    <!-- App icons -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Installed-app feel on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DreamCatcher" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts load asynchronously so they never block first paint. A dream is
      being forgotten while the app boots, so text renders immediately in the
      local Georgia/system fallbacks and upgrades to Fraunces/Newsreader/Karla
      the moment they arrive. If the network is slow or unreachable the app is
      still fully usable instead of showing a blank screen.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Karla:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Karla:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>DreamCatcher</title>
    <style>
      /* App-shell feel: no rubber-band body scroll, no gray tap flash, no
         accidental horizontal scroll while the real stylesheet loads. */
      html, body {
        overscroll-behavior-y: contain;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
